[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixing-matters"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=1.10,<3", "regex>=2023.0"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
mixing-matters = "mixing_matters.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mixing_matters", "src/lost_in_the_middle"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/lost_in_the_middle/**" = ["ALL"]
